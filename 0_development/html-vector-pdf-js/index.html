<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML-to-Vector-PDF | Template Gallery</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6fa; color: #2c3e50; }
.header { background: linear-gradient(135deg, #2c3e50, #3498db); color: white; padding: 30px 40px; }
.header h1 { font-size: 28px; margin-bottom: 6px; }
.header p { font-size: 14px; opacity: 0.85; }
.header .stats { margin-top: 12px; display: flex; gap: 20px; }
.header .stat { background: rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 20px; font-size: 12px; }
.controls { background: white; padding: 15px 40px; border-bottom: 1px solid #e0e0e0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.controls input { padding: 8px 14px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; width: 250px; }
.controls .filter-btn { padding: 6px 14px; border: 1px solid #ddd; border-radius: 20px; background: white; cursor: pointer; font-size: 12px; transition: all 0.2s; }
.controls .filter-btn:hover, .controls .filter-btn.active { background: #3498db; color: white; border-color: #3498db; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 30px 40px; }
.card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; text-decoration: none; color: inherit; }
.card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
.card-preview { height: 160px; background: #f8f9fa; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #eee; padding: 15px; }
.card-preview .doc-icon { font-size: 48px; opacity: 0.3; }
.card-preview .mini-doc { width: 100%; height: 100%; border: 1px solid #ddd; background: white; border-radius: 4px; padding: 8px; font-size: 6px; line-height: 1.3; color: #666; overflow: hidden; }
.card-body { padding: 14px 16px; }
.card-body h3 { font-size: 14px; margin-bottom: 4px; }
.card-body p { font-size: 11px; color: #888; margin-bottom: 8px; }
.card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 500; }
.tag-procurement { background: #e8f5e9; color: #2e7d32; }
.tag-sales { background: #e3f2fd; color: #1565c0; }
.tag-logistics { background: #fff3e0; color: #e65100; }
.tag-finance { background: #fce4ec; color: #c62828; }
.tag-hr { background: #f3e5f5; color: #7b1fa2; }
.tag-warehouse { background: #e0f2f1; color: #00695c; }
.tag-production { background: #efebe9; color: #4e342e; }
.tag-high { background: #ffebee; color: #b71c1c; }
.tag-medium { background: #fff8e1; color: #f57f17; }
.tag-low { background: #e8f5e9; color: #2e7d32; }
.footer { text-align: center; padding: 30px; font-size: 12px; color: #aaa; }
</style>
</head>
<body>

<div class="header">
  <h1>HTML-to-Vector-PDF Template Gallery</h1>
  <p>22 business print form templates with real sample data. Click any card to preview and download PDF.</p>
  <div class="stats">
    <span class="stat">22 Templates</span>
    <span class="stat">7 Categories</span>
    <span class="stat">All Editable</span>
    <span class="stat">Instant PDF Download</span>
  </div>
</div>

<div class="controls">
  <input type="text" id="search" placeholder="Search templates..." oninput="filterCards()">
  <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
  <button class="filter-btn" onclick="setFilter('procurement', this)">Procurement</button>
  <button class="filter-btn" onclick="setFilter('sales', this)">Sales</button>
  <button class="filter-btn" onclick="setFilter('logistics', this)">Logistics</button>
  <button class="filter-btn" onclick="setFilter('finance', this)">Finance</button>
  <button class="filter-btn" onclick="setFilter('hr', this)">HR</button>
  <button class="filter-btn" onclick="setFilter('warehouse', this)">Warehouse</button>
  <button class="filter-btn" onclick="setFilter('production', this)">Production</button>
</div>

<div class="grid" id="grid"></div>

<div class="footer">
  HTML-to-Vector-PDF Template Gallery | All templates use sample data for demonstration purposes
</div>

<script>
const templates = [
  { id: '01', name: 'Purchase Order', file: '01-purchase-order.html', category: 'procurement', complexity: 'high', desc: 'Multi-line items, terms & conditions, approval signatures' },
  { id: '02', name: 'Delivery Order', file: '02-delivery-order.html', category: 'logistics', complexity: 'medium', desc: 'Delivery details, receiver signature, driver info' },
  { id: '03', name: 'Sales Order', file: '03-sales-order.html', category: 'sales', complexity: 'high', desc: 'Customer order with discounts, tax, multi-page' },
  { id: '04', name: 'Quotation', file: '04-quotation.html', category: 'sales', complexity: 'high', desc: 'Price quote with validity, terms, payment schedule' },
  { id: '05', name: 'Commercial Invoice', file: '05-commercial-invoice.html', category: 'finance', complexity: 'high', desc: 'International trade invoice with bank details' },
  { id: '06', name: 'Tax Invoice (GST)', file: '06-tax-invoice.html', category: 'finance', complexity: 'high', desc: 'GST-compliant invoice with tax breakdown' },
  { id: '07', name: 'Credit Note', file: '07-credit-note.html', category: 'finance', complexity: 'medium', desc: 'Refund/credit against original invoice' },
  { id: '08', name: 'Debit Note', file: '08-debit-note.html', category: 'finance', complexity: 'medium', desc: 'Additional charges against original invoice' },
  { id: '09', name: 'Receipt', file: '09-receipt.html', category: 'finance', complexity: 'low', desc: 'Payment acknowledgment with method details' },
  { id: '10', name: 'Packing List', file: '10-packing-list.html', category: 'logistics', complexity: 'medium', desc: 'Shipment contents with weights and dimensions' },
  { id: '11', name: 'Bill of Lading', file: '11-bill-of-lading.html', category: 'logistics', complexity: 'high', desc: 'Shipping document with port and vessel details' },
  { id: '12', name: 'Proforma Invoice', file: '12-proforma-invoice.html', category: 'sales', complexity: 'medium', desc: 'Preliminary invoice for customs/prepayment' },
  { id: '13', name: 'Purchase Requisition', file: '13-purchase-requisition.html', category: 'procurement', complexity: 'medium', desc: 'Internal purchase request with approvals' },
  { id: '14', name: 'Goods Received Note', file: '14-goods-received-note.html', category: 'warehouse', complexity: 'medium', desc: 'Inspection results and quantity verification' },
  { id: '15', name: 'Return Note', file: '15-return-note.html', category: 'warehouse', complexity: 'medium', desc: 'Goods return with reason codes' },
  { id: '16', name: 'Payment Voucher', file: '16-payment-voucher.html', category: 'finance', complexity: 'medium', desc: 'Payment authorization with multiple lines' },
  { id: '17', name: 'Journal Voucher', file: '17-journal-voucher.html', category: 'finance', complexity: 'medium', desc: 'Accounting entries with debit/credit' },
  { id: '18', name: 'Payroll Slip', file: '18-payroll-slip.html', category: 'hr', complexity: 'high', desc: 'Salary breakdown with CPF, allowances, deductions' },
  { id: '19', name: 'Leave Application', file: '19-leave-application.html', category: 'hr', complexity: 'low', desc: 'Leave request form with approval workflow' },
  { id: '20', name: 'Expense Claim', file: '20-expense-claim.html', category: 'hr', complexity: 'medium', desc: 'Expense reimbursement with receipts list' },
  { id: '21', name: 'Stock Transfer', file: '21-stock-transfer.html', category: 'warehouse', complexity: 'medium', desc: 'Inter-warehouse transfer with batch tracking' },
  { id: '22', name: 'Work Order', file: '22-work-order.html', category: 'production', complexity: 'high', desc: 'Production order with BOM and operations' }
];

let activeFilter = 'all';

function renderCards() {
  const search = document.getElementById('search').value.toLowerCase();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  templates
    .filter(t => activeFilter === 'all' || t.category === activeFilter)
    .filter(t => !search || t.name.toLowerCase().includes(search) || t.desc.toLowerCase().includes(search) || t.category.includes(search))
    .forEach(t => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = 'templates/' + t.file;
      card.target = '_blank';
      card.dataset.category = t.category;
      card.innerHTML = `
        <div class="card-preview">
          <div class="mini-doc">
            <div style="font-size:8px;font-weight:bold;margin-bottom:3px;">ACME CORP PTE LTD</div>
            <div style="font-size:6px;color:#999;margin-bottom:6px;">123 Example Street, Singapore</div>
            <div style="font-size:9px;font-weight:bold;color:#c0392b;text-align:center;margin-bottom:4px;">${t.name.toUpperCase()}</div>
            <div style="display:flex;justify-content:space-between;font-size:5px;margin-bottom:4px;">
              <span>Doc No: ACME-${t.id}-0001</span><span>Date: 02 Apr 2026</span>
            </div>
            <table style="width:100%;border-collapse:collapse;font-size:5px;">
              <tr style="background:#2c3e50;color:white;"><td style="padding:1px 2px;">Item</td><td>Description</td><td style="text-align:right;">Amount</td></tr>
              <tr><td style="padding:1px 2px;border-bottom:1px solid #eee;">1</td><td style="border-bottom:1px solid #eee;">Sample Item</td><td style="text-align:right;border-bottom:1px solid #eee;">1,000.00</td></tr>
              <tr><td style="padding:1px 2px;border-bottom:1px solid #eee;">2</td><td style="border-bottom:1px solid #eee;">Another Item</td><td style="text-align:right;border-bottom:1px solid #eee;">2,500.00</td></tr>
            </table>
          </div>
        </div>
        <div class="card-body">
          <h3>${t.id}. ${t.name}</h3>
          <p>${t.desc}</p>
          <div class="card-tags">
            <span class="tag tag-${t.category}">${t.category}</span>
            <span class="tag tag-${t.complexity}">${t.complexity}</span>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
}

function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

function filterCards() { renderCards(); }

renderCards();
</script>
</body>
</html>
